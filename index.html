<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vererbungsrechner – Japanische Mövchen</title><style>
:root{--forest:#183d2c;--teal:#087a7b;--mint:#e5f1ed;--line:#c5d9d0;--ink:#19342d}
*{box-sizing:border-box}body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--mint);color:var(--ink);margin:0}main{max-width:1160px;margin:auto;padding:34px 22px 70px}h1{font-size:clamp(1.55rem,3vw,2.15rem);color:var(--forest);margin:0 0 6px;font-weight:750}h2{color:var(--forest);font-size:1.3rem;margin:0 0 16px}h3{color:var(--teal);margin:28px 0 10px}.intro{margin:0 0 28px;color:#486359}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.panel{background:#fff;padding:24px;border-radius:14px;border:1px solid var(--line);box-shadow:0 4px 18px #163e2b0b}.grid>.panel{border-top:5px solid var(--teal)}label{display:block;margin-top:14px;font-weight:650;font-size:.91rem;color:var(--forest)}select{width:100%;padding:11px 12px;border:1px solid #b5c9c0;border-radius:7px;background:#fff;color:#21382f;font:inherit;min-height:44px}select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #7bb9ad;outline-offset:2px}.hint{font-size:.81rem;color:#60776b;margin:7px 0 12px}.check{display:flex;gap:10px;align-items:center;margin:13px 0;font-weight:500}.check input{width:17px;height:17px;accent-color:var(--teal)}details{border-top:1px solid #dce7e1;margin-top:20px;padding-top:16px}summary{cursor:pointer;color:var(--teal);font-weight:650}button{padding:14px 26px;border:0;border-radius:8px;background:var(--teal);color:white;font:inherit;font-weight:750;cursor:pointer;margin:25px 0;box-shadow:0 3px 8px #087a7b25}button:hover{background:#056668}#output{border-top:4px solid var(--teal)}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #dce7e1;vertical-align:top}th{background:#f0f7f4;color:var(--forest);font-size:.9rem}th:last-child,td:last-child{text-align:right;white-space:nowrap;font-weight:650}small,.note{color:#63796e}.carrier{font-size:.86rem;color:#4f6c5e;margin-top:4px}.warn{border-left:4px solid #b15e42;padding:12px;background:#fff3ed;margin:12px 0;border-radius:5px}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr;gap:15px}main{padding:22px 12px 48px}.panel{padding:17px}th,td{padding:10px 7px;font-size:.91rem}}
</style></head><body><main><h1>Vererbungsrechner für Japanische Mövchen</h1><p class="intro">Es werden nur die eingegebenen Erbanlagen berücksichtigt.</p><div class="grid" id="parents"></div><button id="calculate">Nachkommen berechnen</button><div class="panel" id="output" aria-live="polite">Bitte Elterntiere einstellen und berechnen.</div></main><script>
const B={B:'Schwarzbraun',N:'Nougat',F:'Fuchsrot'},order={B:3,N:2,F:1};
const choices={base:[['B','Schwarzbraun'],['N','Nougat'],['F','Fuchsrot']],rec:[['0','Nicht vorhanden'],['1','Spalterbig'],['2','Sichtbar']],maleZ:[['0','Normal'],['1','Spalterbig'],['2','Sichtbar']],femaleZ:[['0','Normal'],['2','Sichtbar']],drawing:[['solid','Einfarbig'],['dom','Gescheckt'],['white','Weiß']],dom:[['1','Einfaktorig (Dd)'],['2','Doppelfaktorig (DD)']],patch:[['0','Nicht spalt (RR)'],['1','Spalterbig (Rr)'],['2','Reinerbig (rr)']]};
const init=()=>({advanced:false,base:'B',hidden:'B',gray:'0',past:'0',fal:'0',gep:'0',drawing:'solid',dom:'1',patch:'0',crest:false,rose:false});let birds=[init(),init()];
function select(i,key,label,opts){return `<label for="${key}${i}">${label}</label><select id="${key}${i}" data-parent="${i}" data-key="${key}">${opts.map(([v,l])=>`<option value="${v}" ${birds[i][key]===v?'selected':''}>${l}</option>`).join('')}</select>`}
function hiddenOptions(b){return b==='B'?[['B','Keine weitere Erbanlage angegeben'],['N','Nougat'],['F','Fuchsrot']]:b==='N'?[['N','Keine weitere Erbanlage angegeben'],['F','Fuchsrot']]:[['F','Keine weitere Erbanlage angegeben']]}
function render(){document.getElementById('parents').innerHTML=birds.map((x,i)=>`<section class="panel"><h2>${i?'0,1 Henne':'1,0 Hahn'}</h2>${select(i,'base','Grundfarbe',choices.base)}${select(i,'hidden','Spalterbigkeit Grundfarbe',hiddenOptions(x.base))}<p class="hint">Nur eine tatsächlich bekannte zusätzliche Erbanlage auswählen. Sonst die Voreinstellung belassen.</p>${select(i,'gray','Grau',choices.rec)}${select(i,'past','Pastell',choices.rec)}${select(i,'fal','Falbe',i?choices.femaleZ:choices.maleZ)}${select(i,'gep','Geperlt',i?choices.femaleZ:choices.maleZ)}${select(i,'drawing','Scheckung',choices.drawing.map(([v,l])=>[v,l]))}${x.drawing==='dom'||x.drawing==='rec'?`<label for="type${i}">Wie wird die Scheckung vererbt?</label><select id="type${i}" data-parent="${i}" data-key="type"><option value="dom" ${x.drawing==='dom'?'selected':''}>Dominant (Standard)</option><option value="rec" ${x.drawing==='rec'?'selected':''}>Rezessiv</option></select>`:''}<label class="check"><input type="checkbox" data-parent="${i}" data-key="crest" ${x.crest?'checked':''}>Haube</label><label class="check"><input type="checkbox" data-parent="${i}" data-key="rose" ${x.rose?'checked':''}>Rosette</label><details ${x.advanced?'open':''} data-advanced="${i}"><summary>Erweiterte Einstellungen für erfahrene Züchter</summary>${x.drawing==='dom'||x.drawing==='white'?select(i,'dom','Dominante Scheckung: Erbanlage',choices.dom):''}${x.drawing==='dom'||x.drawing==='solid'?select(i,'patch','Zusätzliche rezessive Scheckenanlage',choices.patch.filter(([v])=>v!=='2')):''}<p class="note"><small>Diese Angaben sind nur nötig, wenn die Erbanlagen bekannt sind. Ohne gesicherte Angaben sind die Ergebnisse Modellannahmen.</small></p></details></section>`).join('');document.querySelectorAll('details[data-advanced]').forEach(el=>el.addEventListener('toggle',()=>{birds[+el.dataset.advanced].advanced=el.open}))}
document.getElementById('parents').addEventListener('change',e=>{let t=e.target;if(!t.dataset.key)return;let x=birds[+t.dataset.parent],k=t.dataset.key,v=t.type==='checkbox'?t.checked:t.value;x[k]=v;if(k==='base')x.hidden=v;if(k==='type'){x.drawing=v;x.dom=v==='dom'?'1':'0';x.patch=v==='rec'?'2':'0'}if(k==='drawing'){if(v==='dom'){x.dom='1';x.patch='0'}else if(v==='solid'){x.dom='0';x.patch='0'}else{x.dom='1';x.patch='2'}}render();document.getElementById('output').textContent='Eingaben geändert – bitte neu berechnen.'});
function dom(x){return x.drawing==='dom'||x.drawing==='white'?x.dom:'0'}function rec(x){return x.drawing==='rec'||x.drawing==='white'?'2':x.patch}
function check(x){if([x.hidden,x.gray,x.past,x.fal,x.gep,dom(x),rec(x)].includes('?'))return false;let d=+dom(x),r=+rec(x);return x.drawing==='dom'?d>0&&r!==2:x.drawing==='rec'?d===0&&r===2:x.drawing==='white'?d>0&&r===2:d===0&&r!==2}
const gam=n=>n===0?[[0,1]]:n===1?[[0,.5],[1,.5]]:[[1,1]];
const cross=(a,b)=>gam(+a).flatMap(([x,p])=>gam(+b).map(([y,q])=>[x+y,p*q]));
function calcKnown(m,f){const bothPied=['dom','rec','white'].includes(m.drawing)&&['dom','rec','white'].includes(f.drawing);const whitePiedPair=(m.drawing==='white'&&f.drawing==='dom')||(m.drawing==='dom'&&f.drawing==='white');const out=new Map();let zFather=gam(+m.fal).flatMap(([fa,pf])=>gam(+m.gep).map(([ge,pg])=>[fa,ge,pf*pg]));for(const a of [m.base,m.hidden])for(const b of [f.base,f.hidden])for(const [gray,wg] of cross(m.gray,f.gray))for(const [past,wp] of cross(m.past,f.past))for(const [d,wd] of cross(dom(m),dom(f)))for(const [r,wr] of cross(rec(m),rec(f)))for(const [h,wh] of cross(m.crest?'1':'0',f.crest?'1':'0'))for(const [ro,wro] of cross(m.rose?'1':'0',f.rose?'1':'0'))for(const [zf,zg,wz] of zFather)for(const sex of ['m','f']){const base=order[a]>=order[b]?a+b:b+a, fal=sex==='m'?zf+(f.fal==='2'?1:0):zf,gep=sex==='m'?zg+(f.gep==='2'?1:0):zg;const w=.125*wg*wp*wd*wr*wh*wro*wz;const key=[base,gray,past,d,r,h,ro,fal,gep,sex].join('|');out.set(key,(out.get(key)||0)+w)}
let totals=new Map(),genotypes=new Map(),all=0,excluded=0,draw={white:0,pied:0,solid:0};for(const [key,w] of out){let [base,gray,past,d,r,h,ro,fal,gep,sex]=key.split('|');gray=+gray;past=+past;d=+d;r=+r;h=+h;ro=+ro;fal=+fal;gep=+gep;if(h===2||ro===2){excluded+=w;continue}all+=w;let white=d>0&&r===2,pied=bothPied||d>0||r===2;const piedName=[gray===2?'Grau':null,past===2?'Pastell':null,fal===(sex==='m'?2:1)?'Falbe':null,gep===(sex==='m'?2:1)?'Geperlt':null,B[base[0]]].filter(Boolean).join('-')+'-Schecke';const suffix=(h?' mit Haube':'')+(ro?' mit Rosette':'');
const carriers=[];
if(base[0]!==base[1])carriers.push('Grundfarbe '+B[base[1]]);
if(gray===1)carriers.push('Grau');
if(past===1)carriers.push('Pastell');
if(sex==='m'&&fal===1)carriers.push('Falbe');
if(sex==='m'&&gep===1)carriers.push('Geperlt');
if(r===1)carriers.push('rezessive Scheckung');
const carrierText=carriers.length?'Spalterbig in: '+carriers.join(', '):'Keine zusätzliche Spalterbigkeit aus den Eingaben berechnet';
const addGenotype=(name,weight)=>{name=(sex==='m'?'Hahn|':'Henne|')+name;if(!genotypes.has(name))genotypes.set(name,new Map());const variants=genotypes.get(name);variants.set(carrierText,(variants.get(carrierText)||0)+weight)};
if(whitePiedPair){/* Vereinbarte Zuchtregel: Weiß × dominant gescheckt -> je 50 % Weiß/Schecke. */draw.white+=w*.5;draw.pied+=w*.5;totals.set((sex==='m'?'Hahn|':'Henne|')+'Weiß'+suffix,(totals.get((sex==='m'?'Hahn|':'Henne|')+'Weiß'+suffix)||0)+w*.5);totals.set((sex==='m'?'Hahn|':'Henne|')+piedName+suffix,(totals.get((sex==='m'?'Hahn|':'Henne|')+piedName+suffix)||0)+w*.5);addGenotype('Weiß'+suffix,w*.5);addGenotype(piedName+suffix,w*.5)}else{draw[white?'white':pied?'pied':'solid']+=w;let name=(white?'Weiß':pied?piedName:piedName.replace(/-Schecke$/,''))+suffix;totals.set((sex==='m'?'Hahn|':'Henne|')+name,(totals.get((sex==='m'?'Hahn|':'Henne|')+name)||0)+w);addGenotype(name,w)}}
return {totals:new Map([...totals].map(([k,v])=>[k,v/all])),genotypes:new Map([...genotypes].map(([name,variants])=>[name,new Map([...variants].map(([label,weight])=>[label,weight/all]))])),draw:Object.fromEntries(Object.entries(draw).map(([k,v])=>[k,v/all])),excluded};}
function variants(x,i){let list=[{...x}];const apply=(key,vals)=>{list=list.flatMap(v=>vals.map(a=>({...v,[key]:a}))) };for(const k of ['gray','past','fal','gep'])if(x[k]==='?')apply(k,k==='fal'||k==='gep'?(i?['0','2']:['0','1','2']):['0','1','2']);if(dom(x)==='?')apply('dom',['1','2']);if(rec(x)==='?')apply('patch',x.drawing==='rec'||x.drawing==='white'?['2']:['0','1']);return list.filter(check)}
function calc(){const m=variants(birds[0],0),f=variants(birds[1],1);const output=document.getElementById('output');if(!m.length||!f.length){output.innerHTML='<strong>Angaben widersprechen sich.</strong><p>Bitte Scheckung und zusätzliche Erbanlagen prüfen.</p>';return}const count=m.length*f.length;if(count>400){output.innerHTML='<strong>Zu viele unbekannte Erbanlagen für eine übersichtliche Berechnung.</strong><p>Bitte mindestens eine weitere Angabe zu den Elterntieren ergänzen. Die unbekannten Anlagen werden nicht automatisch als gleich wahrscheinlich gewertet.</p>';return}
const names=new Map(),carrierRanges=new Map(),drawing={white:[1,0],pied:[1,0],solid:[1,0]};for(const a of m)for(const b of f){const result=calcKnown(a,b);for(const [name,value] of result.totals){if(!names.has(name))names.set(name,[1,0]);}
for(const [name,entries] of result.genotypes)for(const [label] of entries){const key=JSON.stringify([name,label]);if(!carrierRanges.has(key))carrierRanges.set(key,[1,0])}
for(const [key,range] of carrierRanges){const [name,label]=JSON.parse(key);const value=result.genotypes.get(name)?.get(label)||0;range[0]=Math.min(range[0],value);range[1]=Math.max(range[1],value)}for(const [name,range] of names){const value=result.totals.get(name)||0;range[0]=Math.min(range[0],value);range[1]=Math.max(range[1],value)}for(const key of Object.keys(drawing)){drawing[key][0]=Math.min(drawing[key][0],result.draw[key]);drawing[key][1]=Math.max(drawing[key][1],result.draw[key])}}
const fmt=w=>(100*w).toLocaleString('de-DE',{maximumFractionDigits:2})+' %';const range=([a,b])=>Math.abs(a-b)<1e-9?fmt(a):fmt(a)+' – '+fmt(b);const unknown=count>1;const warnings=[];if(birds[0].drawing==='white'&&birds[1].drawing==='white')warnings.push('Weiß × Weiß: nicht empfohlen. Das Modell berücksichtigt beobachtete Verluste nicht.');if(birds[0].crest&&birds[1].crest||birds[0].rose&&birds[1].rose)warnings.push('Bei Haube × Haube bzw. Rosette × Rosette wurden mögliche doppelfaktorige Nachkommen im Arbeitsmodell ausgeschlossen. Die tatsächliche Letalität ist nicht gesichert.');const rows=[...names].filter(([n,[lo,hi]])=>hi>1e-9).sort((a,b)=>b[1][1]-a[1][1]);
const section=(sex,title)=>{const subset=rows.filter(([n])=>n.startsWith(sex+'|'));return `<h3>${title}</h3><table><thead><tr><th>Farbschlag und Spalterbigkeit</th><th>${unknown?'Möglicher Anteil':'Anteil'}</th></tr></thead><tbody>${subset.map(([n,v])=>{const variants=[...carrierRanges].filter(([key,r])=>JSON.parse(key)[0]===n&&r[1]>1e-9).map(([key,r])=>`<div class="carrier">${JSON.parse(key)[1]}</div>`).join('');return `<tr><td><strong>${n.split('|').slice(1).join('|')}</strong>${variants}</td><td>${range(v)}</td></tr>`}).join('')}</tbody></table>`};
output.innerHTML=`<h2>Nachkommen (theoretisches Modell)</h2>${warnings.map(s=>`<div class="warn">${s}</div>`).join('')}${unknown?`<p><strong>Erweiterte Angaben sind unklar.</strong> Prozentbereiche beziehen sich nur auf ausdrücklich als unbekannt markierte Faktoren; zusätzliche Grundfarben werden nicht vermutet.</p>`:''}<p><strong>Weiß:</strong> ${range(drawing.white)} · <strong>Schecke:</strong> ${range(drawing.pied)} · <strong>Einfarbig:</strong> ${range(drawing.solid)}</p><p class="note">Die Anteile beziehen sich auf alle Jungvögel zusammen. Rechnerisch entfallen jeweils 50 % auf Hähne und Hennen.</p>${section('Hahn','Männliche Jungvögel (1,0)')}${section('Henne','Weibliche Jungvögel (0,1)')}<p class="note">${unknown?`Berücksichtigte mögliche Genotyp-Kombinationen: ${count}. Die Grenzen einzelner Zeilen müssen nicht gleichzeitig auftreten. `:''}Prozentwerte gelten für die modellhaft überlebensfähigen Nachkommen. Genetische Annahmen sind nicht durch jeden Zuchtfall bestätigt.</p>`;}
document.getElementById('calculate').addEventListener('click',calc);render();
</script></body></html>
